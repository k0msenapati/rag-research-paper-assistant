[project]
name = "backend"
version = "0.1.0"
description = "PaperPilot AI Backend"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.20.0",
    "chromadb>=0.5.18",
    "fastapi>=0.115.0",
    "fastembed>=0.4.0",
    "groq>=0.11.0",
    "httpx>=0.27.2",
    "langchain>=0.3.7",
    "langchain-core>=0.3.15",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=0.2.45",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "pymupdf>=1.24.14",
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "python-multipart>=0.0.17",
    "sentence-transformers>=3.3.0",
    "sqlalchemy>=2.0.36",
    "torch>=2.4.0",
    "uvicorn[standard]>=0.32.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

